spring.application.name=lateTicket

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/biletflow
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=BiletFlowSuperSecretKeyForJWTTokenGeneration2024MustBeLongEnough
app.jwt.expiration-ms=86400000

# Mail (configure for your SMTP provider)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Orders: unpaid PENDING orders are cancelled (seats/tickets/promo released) after this many minutes
app.orders.pending-timeout-minutes=15
app.orders.expiry-check-ms=60000
